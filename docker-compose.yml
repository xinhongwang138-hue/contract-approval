services:
  db:
    image: postgres:16-alpine
    container_name: contract-approval-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contract_owner
      POSTGRES_PASSWORD: contract_owner_pwd
      POSTGRES_DB: contract
      APP_DB_PASSWORD: contract_app_pwd
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - contract_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_owner -d contract"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  contract_pgdata:
